name: Format test deployment changes with Prettier
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes prettier@3.5.3 --write index.js
      - name: Commit formatting if changed
        run: |
          if git diff --quiet; then
            echo "index.js already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "style: format test deployment configuration"
          git push
