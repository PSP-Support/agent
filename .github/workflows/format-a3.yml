name: Format A3 changes
on:
  push:
    branches:
      - fix/a3-resource-only-action-costs
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a3-resource-only-action-costs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes prettier@3.5.3 --write index.js data/action-costs.js data/weapons.js test/action-costs.test.js
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js data/action-costs.js data/weapons.js test/action-costs.test.js
          git commit -m "style: format A3 resource cost changes"
          git push
