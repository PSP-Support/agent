name: Node tests and syntax
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node --check index.js
      - run: node --check db.js
      - run: node --check data/countries.js
      - run: node --check data/weapons.js
      - run: node --check settlement.js
      - run: node --check economy.js
