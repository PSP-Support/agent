name: Format A4 economy scale changes
on:
  push:
    branches:
      - feat/a4-true-economy-scale-1000
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/a4-true-economy-scale-1000
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes prettier@3.5.3 --write index.js data/countries.js data/buildings.js data/weapons.js economy.js scripts/preflight-economy-migration.js test/action-costs.test.js test/economy-scale.test.js
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js data/countries.js data/buildings.js data/weapons.js economy.js scripts/preflight-economy-migration.js test/action-costs.test.js test/economy-scale.test.js
          git commit -m "style: format A4 economy scale changes"
          git push
